<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Sheet - Claymore</title>
<!-- Metadados para o Canva (e outros) reconhecerem a página como incorporável -->
<link rel="iframely player" href="https://griseustf.github.io/flipbooks/model-sheet-claymore/" media="aspect-ratio: 16/9">
<meta property="og:type" content="website">
<meta property="og:title" content="Model Sheet - Claymore">
<meta property="og:url" content="https://griseustf.github.io/flipbooks/model-sheet-claymore/">
<meta property="og:image" content="https://griseustf.github.io/flipbooks/model-sheet-claymore/paginas/p-1.jpg">
<meta name="twitter:card" content="player">
<meta name="twitter:title" content="Model Sheet - Claymore">
<meta name="twitter:player" content="https://griseustf.github.io/flipbooks/model-sheet-claymore/">
<meta name="twitter:player:width" content="960">
<meta name="twitter:player:height" content="540">
<meta name="twitter:image" content="https://griseustf.github.io/flipbooks/model-sheet-claymore/paginas/p-1.jpg">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #stage { position: fixed; inset: 0; background: transparent; min-width: 0 !important; min-height: 0 !important; }
  .page { background: #fff; }
  .page img { width: 100%; height: 100%; display: block; object-fit: contain; pointer-events: none; user-select: none; -webkit-user-drag: none; }
  .nav {
    position: fixed; top: 50%; transform: translateY(-50%); z-index: 10;
    width: 40px; height: 40px; border: 0; border-radius: 50%;
    background: rgba(0,0,0,.35); color: #fff; font-size: 22px; line-height: 40px;
    cursor: pointer; opacity: 0; transition: opacity .2s, background .2s;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  body:hover .nav { opacity: 1; }
  .nav:hover { background: rgba(0,0,0,.6); }
  .nav[disabled] { display: none; }
  #prev { left: 8px; } #next { right: 8px; }
  @media (hover: none) { .nav { opacity: .85; } }
</style>
</head>
<body>
<div id="stage"></div>
<button class="nav" id="prev" aria-label="Página anterior">&#8249;</button>
<button class="nav" id="next" aria-label="Próxima página">&#8250;</button>

<script src="lib/page-flip.browser.js"></script>
<script>
  // Para adicionar/remover páginas, edite esta lista.
  var PAGINAS = ["paginas/p-1.jpg", "paginas/p-2.jpg", "paginas/p-3.jpg"];

  var stage = document.getElementById("stage");
  PAGINAS.forEach(function (src) {
    var d = document.createElement("div");
    d.className = "page";
    var img = document.createElement("img");
    img.src = src; img.alt = ""; img.draggable = false;
    d.appendChild(img);
    stage.appendChild(d);
  });

  var flip = new St.PageFlip(stage, {
    width: 1600, height: 900,          // proporção 16:9 das páginas
    size: "stretch",
    autoSize: false,
    minWidth: 3000, maxWidth: 4000,    // minWidth alto = sempre 1 página por vez
    minHeight: 100, maxHeight: 4000,
    usePortrait: true,
    showCover: false,
    maxShadowOpacity: 0.35,
    mobileScrollSupport: false,
    flippingTime: 800
  });
  flip.loadFromHTML(document.querySelectorAll(".page"));

  var prev = document.getElementById("prev"), next = document.getElementById("next");
  function atualizar() {
    var i = flip.getCurrentPageIndex(), n = flip.getPageCount();
    prev.disabled = i <= 0; next.disabled = i >= n - 1;
  }
  prev.onclick = function () { flip.flipPrev(); };
  next.onclick = function () { flip.flipNext(); };
  flip.on("flip", atualizar);
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") flip.flipPrev();
    if (e.key === "ArrowRight") flip.flipNext();
  });
  atualizar();
</script>
</body>
</html>
